[package]
name = "ptcgp-db-data"
version = "0.5.0"
edition = "2024"
license.workspace = true
build = "codegen/main.rs"

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
gcd = "2.3.0"
memchr = "2.8.1"
smallvec = "1.15.1"
smol_str = "0.3.6"

[build-dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
gcd = "2.3.0"
prettyplease = "0.3.0"
proc-macro2 = { version = "1.0.106", default-features = false }
quote = { version = "1.0.45", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["arbitrary_precision"] }
syn = { version = "3.0.4", default-features = false, features = ["parsing"] }
icu_normalizer = { version = "2", features = ["compiled_data"] }

